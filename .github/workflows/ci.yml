# The gate PLAN.md §9 has asked for: every job here runs a Makefile target that
# already exists. The recipes are where this project's environment traps are
# recorded (webkit2gtk-4.1 only, the Wails CLI outside PATH, npm 9 unable to
# install Tailwind's binding), so a workflow that spelled those commands out
# again would be a second copy of the build that can drift from the first.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A superseded push should not hold a runner: only the newest commit of a branch
# is a result anyone is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned to go.mod's wails/v2 v2.15.0. The CLI renders the project template and
# drives the build, so a CLI from another version builds against something the
# library does not match; README's `@latest` is the instruction for a person
# setting up a machine, not for a gate that has to be reproducible.
#
# The actions are pinned to the first major each one published that runs on
# Node 24 — checkout v5, setup-go v6, setup-node v5 — because Node 20 was
# deprecated on runners and every job now reports that it is being forced onto
# Node 24. That warning has the shape of the v3 artifact-action notice, which ended
# in a hard block, so the runtime is not something a gate should be behind on.
#
# Some of those majors changed something else too, and each was checked against
# this repository rather than assumed harmless: setup-go v6 reworks toolchain
# selection (go.mod carries `go 1.26.0` and no `toolchain` line, which is the
# version it then installs), setup-node v5 turns caching on by itself only when
# package.json has a `packageManager` field (this one does not, and `cache: npm` is
# explicit here), and checkout v5 asks for a runner of 2.327.1 or newer, which a
# GitHub-hosted runner is. The majors after them — checkout v6/v7, setup-go v7,
# setup-node v7 — are not taken: their breaking changes are unrelated to the
# runtime, so adopting them is a separate decision with its own check, not a side
# effect of this one.
env:
  WAILS_VERSION: v2.15.0

jobs:
  linux:
    name: check and build (linux/webkit2gtk-4.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `make build` passes this tag for a Linux target; `make check`'s vet and
      # test do not, and would compile Wails' untagged variant, whose cgo asks
      # pkg-config for webkit2gtk-4.0. Ubuntu 24.04 ships 4.1 only — the same
      # situation as the development machine — so the tag is set for the whole
      # job and check tests the variant that ships rather than one that cannot
      # link here. It is inert on the GOOS=windows and GOOS=darwin vets.
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Node 22, because the lockfile's platform-gated optional dependencies need
      # npm 10 (the Makefile's `deps` target records what npm 9 does to Tailwind's
      # native binding), and Vite 7 needs 20.19+/22.12+.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the GTK and WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check

      # `check` vets and tests but never links, so on its own it cannot see a
      # missing webkit2gtk-4.1 — the tag it exists for is a link-time flag. This
      # is also the only step that builds the frontend bundle and embeds it.
      - name: make build
        run: make build

  # linux/arm64 is the one artifact that cannot be cross-built, and so the one place a
  # second architecture needs a second runner. The Linux build is cgo against
  # webkit2gtk; an arm64 link needs the arm64 headers and an arm64 compiler, and on an
  # x64 host gcc rejects the assembly (measured: `gcc_arm64.S:65: Error: no such
  # instruction: 'ldp x23,x24,[sp,'`). The runner is Arm's own ubuntu-24.04-arm image,
  # so the same apt line installs arm64 headers and `dpkg --print-architecture` makes
  # `make deb` name the package arm64 — no Makefile change beyond naming the Tailwind
  # binding by host arch, which is what this job proves. It is a *standard* runner, so
  # its minutes come out of the plan's included allowance exactly as the x64 Linux
  # job's do.
  #
  # No `make check` here: the x64 job is the gate, and this one answers the narrower
  # question — does the arm64 package build and is it really arm64.
  linux-arm64:
    name: package (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      GOFLAGS: -tags=webkit2_41
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # gcc is named rather than assumed: cgo needs a C compiler to build the
      # webkit2gtk layer at all, and these images are Arm LLC's, not GitHub's — the x64
      # image happens to ship gcc, which is not evidence about this one.
      - name: Install the GTK and WebKit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config gcc

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make deb
        run: make deb

      # The arch is read back out of the package rather than inferred from the runner:
      # a .deb whose Architecture says amd64 is the wrong download for the machine it
      # is offered to, and building it on an arm64 host is exactly the assumption that
      # would hide that (the Makefile's DEB_ARCH is `?=`, so it can be overridden).
      - name: The package is arm64 and carries the binary
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/deb/kichat_*_arm64.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "expected one arm64 .deb, found ${#debs[@]} in build/deb:" >&2
            ls -1 build/deb >&2
            exit 1
          fi
          deb="${debs[0]}"
          arch="$(dpkg-deb --field "$deb" Architecture)"
          if [ "$arch" != "arm64" ]; then
            echo "$deb says Architecture: $arch" >&2
            exit 1
          fi
          listing="$(mktemp)"
          dpkg-deb --contents "$deb" > "$listing"
          grep -q '\./usr/bin/kichat$' "$listing" \
            || { echo "$deb carries no /usr/bin/kichat" >&2; exit 1; }
          rm -f "$listing"
          echo "$deb: Architecture $arch, $(dpkg-deb --field "$deb" Installed-Size) KiB"

  windows:
    name: build (windows/amd64 and windows/arm64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Before checkout, and not after: MSYS2's make is a POSIX program, so a
      # working tree converted to CRLF would leave a \r at the end of every recipe
      # line for bash to execute. The repository stores LF and the Makefile is
      # written for it, so no conversion is the only tree this job can build.
      - name: Check out with LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The recipes are POSIX sh and the Makefile sets SHELL := /bin/bash, which
      # AGENTS.md names as what a Windows build needs beside make. MSYS2's make
      # is the one that resolves /bin/bash; a native build of make hands the
      # string to CreateProcess and fails on the first recipe.
      #
      # path-type: inherit, because the action's default (minimal) hands the
      # MSYS2 shell only Windows' own directories: the Go and Node that
      # setup-go/setup-node installed are on the job's PATH but not inside this
      # shell, and the first run failed with `go: command not found` and then
      # npm resolved through the Makefile's Linux fallback
      # (~/.local/node/bin/npm), which does not exist on a runner. The Makefile
      # asks the toolchain which platform it is on, so the toolchain has to be
      # reachable from this shell, not merely installed.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make
          path-type: inherit

      - name: Install the Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Wails writes the version resource, the manifest and the icon in pure Go,
      # so this needs neither mingw nor a Windows SDK; the target also fails when
      # no executable was left in build/bin, which Wails itself would not.
      - name: make windows
        shell: msys2 {0}
        run: make windows

      # The arm64 executable needs no arm64 runner to build: nothing on the Windows
      # path needs cgo and Wails writes the PE resource, the manifest and the icon in
      # pure Go, so the same cross-build answers with a PE32+ AArch64 image (measured on
      # an amd64 Linux host: 21.7 MB, `PE32+ executable (GUI) Aarch64`). It is the
      # binary a Windows-on-Arm laptop runs, and this is where it stops compiling
      # unnoticed. Packaged only by the release, which is the job that installs NSIS.
      - name: make windows (arm64)
        shell: msys2 {0}
        run: make windows WINDOWS_ARCH=arm64

  darwin:
    name: build (darwin/universal)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # macOS is the one platform Wails can only package on: `make darwin` first
      # refuses a non-Mac host (Wails exits 0 having built nothing there), then
      # builds both slices, and finally reads the version back out of the bundle's
      # plist and compares it with VERSION — a drift `make check` cannot see.
      - name: make darwin
        run: make darwin
